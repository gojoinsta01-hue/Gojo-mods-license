name: Build Gojo Mods DEX

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-dex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Compile Java to .class
        run: |
          mkdir -p build
          javac -source 8 -target 8 -Xlint:-options \
            -bootclasspath $ANDROID_HOME/platforms/android-34/android.jar \
            -d build \
            src/com/whatever/mods/*.java

      - name: Convert .class to classes.dex with d8
        run: |
          $ANDROID_HOME/build-tools/34.0.0/d8 \
            --output build \
            --min-api 21 \
            --lib $ANDROID_HOME/platforms/android-34/android.jar \
            build/com/whatever/mods/*.class

      - name: Verify dex exists
        run: ls -la build/classes.dex

      - name: Upload classes.dex artifact
        uses: actions/upload-artifact@v4
        with:
          name: gojo-mods-dex
          path: build/classes.dex
          retention-days: 90
